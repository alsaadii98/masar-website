<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F4F5F6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#17181B" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/svg+xml" href="/assets/masar-logo.svg">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="preload" href="/assets/fonts/ReadexPro-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/pages.css">
  <meta name="robots" content="noindex">
  <title>مكان على مسار — مسار</title>
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Masar Maps">
  <meta property="og:title" content="مكان على مسار">
  <meta property="og:image" content="https://masarmaps.com/assets/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <a class="brand" href="/" aria-label="الرئيسية"><img class="tile" src="/assets/brand/masar-app-tile-light.svg" alt="" width="40" height="40"><img class="word on-light" src="/assets/brand/masar-wordmark-arabic-light.svg" alt="مسار" width="68" height="34"><img class="word on-dark" src="/assets/brand/masar-wordmark-arabic-dark.svg" alt="مسار" width="68" height="34"></a>
      <nav class="langs" aria-label="Language"><a class="chip" href="/p" lang="ar" hreflang="ar" data-keep-query aria-current="page">العربية</a><a class="chip" href="/en/p" lang="en" hreflang="en" data-keep-query>English</a><a class="chip" href="/ckb/p" lang="ckb" hreflang="ckb" data-keep-query>کوردی</a></nav>
    </div>
  </header>
  <main class="wrap">
    <section class="card place">
      <div class="host-static"><img src="/assets/brand/mascot.svg" alt="" width="78" height="76"></div>
      <h1 id="name">مكان مشترك</h1>
      <p class="lead coords"><bdi id="coords"></bdi></p>
      <div id="ok">
        <div class="btn-row">
          <a class="btn" id="open" href="#">افتح في مسار</a>
          <a class="btn-secondary" id="get" href="https://play.google.com/store/apps/details?id=com.masarmaps">حمّل التطبيق</a>
        </div>
        <p><a id="map" href="#">افتح في تطبيق خرائط</a></p>
        <p class="sources" id="soon" hidden>قريباً على App Store و Google Play.</p>
      </div>
      <p class="lead" id="bad" hidden>هذا الرابط غير صالح.</p>
    </section>
  </main>
  <footer class="foot wrap">
    <p>بيانات الخريطة © <a href="https://www.openstreetmap.org/copyright">مساهمو OpenStreetMap</a> · <bdi>masarmaps.com</bdi></p>
  </footer>
  <script>
  (function () {
    var cfg = {"play": "https://play.google.com/store/apps/details?id=com.masarmaps", "appStore": "", "pkg": "com.masarmaps", "fallback": "مكان مشترك"};
    var q = new URLSearchParams(location.search);
    var ll = (q.get('ll') || '').split(',');
    var lat = parseFloat(ll[0]), lon = parseFloat(ll[1]);
    var valid = ll.length === 2 && isFinite(lat) && isFinite(lon) && Math.abs(lat) <= 90 && Math.abs(lon) <= 180;
    document.querySelectorAll('[data-keep-query]').forEach(function (a) { a.href = a.getAttribute('href') + location.search; });
    if (!valid) {
      document.getElementById('ok').hidden = true;
      document.getElementById('bad').hidden = false;
      return;
    }
    var name = (q.get('n') || '').trim().slice(0, 80) || cfg.fallback;
    document.getElementById('name').textContent = name;
    document.title = name + ' — ' + document.title.split(' — ').pop();
    var la = lat.toFixed(5), lo = lon.toFixed(5);
    document.getElementById('coords').textContent = la + ', ' + lo;

    var ua = navigator.userAgent;
    var android = /Android/i.test(ua);
    var ios = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
    var open = document.getElementById('open');
    if (android) {
      // intent: opens the app if installed, otherwise Play. A plain link to this
      // same URL would stay in the browser.
      open.href = 'intent://masarmaps.com/p' + location.search + '#Intent;scheme=https;package=' + cfg.pkg +
        ';S.browser_fallback_url=' + encodeURIComponent(cfg.play) + ';end';
    } else {
      open.href = 'https://masarmaps.com/p' + location.search;
    }
    var get = document.getElementById('get');
    if (ios) {
      if (cfg.appStore) get.href = cfg.appStore; else { get.hidden = true; document.getElementById('soon').hidden = false; }
    }
    var map = document.getElementById('map');
    map.href = android
      ? 'geo:' + la + ',' + lo + '?q=' + la + ',' + lo + '(' + encodeURIComponent(name) + ')'
      : 'https://www.openstreetmap.org/?mlat=' + la + '&mlon=' + lo + '#map=17/' + la + '/' + lo;
  })();
  </script>
</body>
</html>
