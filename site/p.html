<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#31C6F7">
  <meta name="color-scheme" content="light dark">
  <script>try{var t=localStorage.getItem('masar-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
  <link rel="icon" type="image/svg+xml" href="/assets/masar-logo.svg">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="preload" href="/assets/fonts/Vazirmatn-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/Vazirmatn-ExtraBold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/pages.css">
  <meta name="robots" content="noindex">
  <title>مكان على مسار — مسار</title>
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Masar Maps">
  <meta property="og:title" content="مكان على مسار">
  <meta property="og:image" content="https://masarmaps.com/assets/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
</head>
<body>
  <div class="cyan">
    <header class="top">
      <div class="wrap">
        <a class="brand" href="/" aria-label="الرئيسية"><img class="tile" src="/assets/brand/masar-app-tile-light.svg" alt="" width="42" height="42"><img class="word" src="/assets/brand/masar-wordmark-arabic-light.svg" alt="مسار" width="64" height="32"></a>
        <div class="tools"><button class="chip theme-btn" id="theme-btn" type="button" title="المظهر" data-title="المظهر" data-auto="تلقائي" data-light="نهاري" data-dark="ليلي"><svg class="ico" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960"><path d="M324-111.5Q251-143 197-197t-85.5-127Q80-397 80-480t31.5-156Q143-709 197-763t127-85.5Q397-880 480-880t156 31.5Q709-817 763-763t85.5 127Q880-563 880-480t-31.5 156Q817-251 763-197t-127 85.5Q563-80 480-80t-156-31.5ZM500-140q137-10 228.5-106T820-480q0-138-91.5-234T500-820v680Z"/></svg><span>تلقائي</span></button><nav class="langs" aria-label="Language"><a class="chip" href="/p" lang="ar" hreflang="ar" data-keep-query aria-current="page">العربية</a><a class="chip" href="/en/p" lang="en" hreflang="en" data-keep-query>English</a><a class="chip" href="/ckb/p" lang="ckb" hreflang="ckb" data-keep-query>کوردی</a></nav></div>
      </div>
    </header>
    <main class="wrap state place">
      <img class="mascot bob" src="/assets/brand/mascot-v5.svg" alt="" width="180" height="180">
      <h1 id="name">مكان مشترك</h1>
      <p class="lead coords"><bdi id="coords"></bdi></p>
      <div id="ok" class="btn-col">
        <a class="btn" id="open" href="#">افتح في مسار</a>
        <a class="btn-dark" id="get" href="https://play.google.com/store/apps/details?id=com.masarmaps">حمّل التطبيق</a>
        <a class="link-quiet" id="map" href="#">افتح في تطبيق خرائط</a>
        <p class="sources" id="soon" hidden>قريباً على App Store و Google Play.</p>
      </div>
      <p class="lead" id="bad" hidden>هذا الرابط غير صالح.</p>
    </main>
  </div>
  <footer class="b-foot">
    <div class="wrap b-foot-in">
      <img class="mascot" src="/assets/brand/mascot-v5.svg" alt="" width="104" height="104">
      <p class="foot-title">مسار لكل مشوار</p>
      <nav aria-label="الدعم"><a href="/waze-alternative">بديل ويز</a><a href="/privacy">الخصوصية</a><a href="/terms">الشروط</a><a href="/delete-account">حذف الحساب</a><a href="/support">الدعم</a></nav>
      <p class="foot-small">بيانات الخريطة © <a href="https://www.openstreetmap.org/copyright">مساهمو OpenStreetMap</a> · <bdi>masarmaps.com</bdi></p>
    </div>
  </footer>
  <script>
  (function () {
    var cfg = {"play": "https://play.google.com/store/apps/details?id=com.masarmaps", "appStore": "", "pkg": "com.masarmaps", "fallback": "مكان مشترك"};
    var q = new URLSearchParams(location.search);
    var ll = (q.get('ll') || '').split(',');
    var lat = parseFloat(ll[0]), lon = parseFloat(ll[1]);
    var valid = ll.length === 2 && isFinite(lat) && isFinite(lon) && Math.abs(lat) <= 90 && Math.abs(lon) <= 180;
    document.querySelectorAll('[data-keep-query]').forEach(function (a) { a.href = a.getAttribute('href') + location.search; });
    if (!valid) {
      document.getElementById('ok').hidden = true;
      document.getElementById('bad').hidden = false;
      return;
    }
    var name = (q.get('n') || '').trim().slice(0, 80) || cfg.fallback;
    document.getElementById('name').textContent = name;
    document.title = name + ' — ' + document.title.split(' — ').pop();
    var la = lat.toFixed(5), lo = lon.toFixed(5);
    document.getElementById('coords').textContent = la + ', ' + lo;

    var ua = navigator.userAgent;
    var android = /Android/i.test(ua);
    var ios = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
    var open = document.getElementById('open');
    if (android) {
      // intent: opens the app if installed, otherwise Play. A plain link to this
      // same URL would stay in the browser.
      open.href = 'intent://masarmaps.com/p' + location.search + '#Intent;scheme=https;package=' + cfg.pkg +
        ';S.browser_fallback_url=' + encodeURIComponent(cfg.play) + ';end';
    } else {
      open.href = 'https://masarmaps.com/p' + location.search;
    }
    var get = document.getElementById('get');
    if (ios) {
      if (cfg.appStore) get.href = cfg.appStore; else { get.hidden = true; document.getElementById('soon').hidden = false; }
    }
    var map = document.getElementById('map');
    map.href = android
      ? 'geo:' + la + ',' + lo + '?q=' + la + ',' + lo + '(' + encodeURIComponent(name) + ')'
      : 'https://www.openstreetmap.org/?mlat=' + la + '&mlon=' + lo + '#map=17/' + la + '/' + lo;
  })();
  </script>
  <script>
  (function () {
    var b = document.getElementById('theme-btn');
    if (!b) return;
    var order = ['auto', 'light', 'dark'];
    var root = document.documentElement;
    function current() { return root.getAttribute('data-theme') || 'auto'; }
    function show() { var m = current(); b.querySelector('span').textContent = b.dataset[m]; b.setAttribute('aria-label', b.dataset.title + ': ' + b.dataset[m]); }
    b.addEventListener('click', function () {
      var next = order[(order.indexOf(current()) + 1) % 3];
      if (next === 'auto') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', next);
      try { if (next === 'auto') localStorage.removeItem('masar-theme'); else localStorage.setItem('masar-theme', next); } catch (e) {}
      show();
    });
    show();
  })();
  </script>
</body>
</html>
