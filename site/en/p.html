<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <script>try{var t=localStorage.getItem('masar-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
  <link rel="icon" type="image/svg+xml" href="/assets/masar-logo.svg">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="preload" href="/assets/fonts/Vazirmatn-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/Vazirmatn-ExtraBold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/pages.css">
  <meta name="robots" content="noindex">
  <title>Place on Masar — Masar</title>
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Masar Maps">
  <meta property="og:title" content="Place on Masar">
  <meta property="og:image" content="https://masarmaps.com/assets/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <a class="brand" href="/" aria-label="Home"><img class="tile" src="/assets/brand/masar-app-tile-light.svg" alt="" width="40" height="40"><span class="latin">Masar</span></a>
      <div class="tools"><button class="chip theme-btn" id="theme-btn" type="button" title="Appearance" data-title="Appearance" data-auto="Automatic" data-light="Light" data-dark="Dark"><svg class="ico" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960"><path d="M324-111.5Q251-143 197-197t-85.5-127Q80-397 80-480t31.5-156Q143-709 197-763t127-85.5Q397-880 480-880t156 31.5Q709-817 763-763t85.5 127Q880-563 880-480t-31.5 156Q817-251 763-197t-127 85.5Q563-80 480-80t-156-31.5ZM500-140q137-10 228.5-106T820-480q0-138-91.5-234T500-820v680Z"/></svg><span>Automatic</span></button><nav class="langs" aria-label="Language"><a class="chip" href="/p" lang="ar" hreflang="ar" data-keep-query>العربية</a><a class="chip" href="/en/p" lang="en" hreflang="en" data-keep-query aria-current="page">English</a><a class="chip" href="/ckb/p" lang="ckb" hreflang="ckb" data-keep-query>کوردی</a></nav></div>
    </div>
  </header>
  <main class="wrap">
    <section class="state place">
      <span class="disc disc-xl" aria-hidden="true"><svg class="ico" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960"><path d="M458.5-103.5Q448-107 440-115q-42-38-91-87.5T258-309q-42-57-70-119t-28-124q0-150 96.5-239T480-880q127 0 223.5 89T800-552q0 62-28 124t-70 119q-42 57-91 106.5T520-115q-8 8-18.5 11.5T480-100q-11 0-21.5-3.5Zm71-407Q550-531 550-560t-20.5-49.5Q509-630 480-630t-49.5 20.5Q410-589 410-560t20.5 49.5Q451-490 480-490t49.5-20.5Z"/></svg></span>
      <h1 id="name" style="margin-top: 24px">Shared place</h1>
      <p class="lead coords"><bdi id="coords"></bdi></p>
      <div id="ok" class="btn-col">
        <a class="btn" id="open" href="#">Open in Masar</a>
        <a class="btn-secondary" id="get" href="https://play.google.com/store/apps/details?id=com.masarmaps">Get the app</a>
        <a class="link-quiet" id="map" href="#">Open in a map</a>
        <p class="sources" id="soon" hidden>Coming soon to the App Store and Google Play.</p>
      </div>
      <p class="lead" id="bad" hidden>This link is not valid.</p>
      <div class="shot"><div class="phone"><div class="screen"><img class="on-light" src="/assets/screens/place.png" alt="Masar place card" width="384" height="838" loading="lazy"><img class="on-dark" src="/assets/screens/place-dark.png" alt="Masar place card" width="384" height="838" loading="lazy"></div></div></div>
    </section>
  </main>
  <footer class="foot wrap">
    <p>Map data © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a> · <bdi>masarmaps.com</bdi></p>
  </footer>
  <script>
  (function () {
    var cfg = {"play": "https://play.google.com/store/apps/details?id=com.masarmaps", "appStore": "", "pkg": "com.masarmaps", "fallback": "Shared place"};
    var q = new URLSearchParams(location.search);
    var ll = (q.get('ll') || '').split(',');
    var lat = parseFloat(ll[0]), lon = parseFloat(ll[1]);
    var valid = ll.length === 2 && isFinite(lat) && isFinite(lon) && Math.abs(lat) <= 90 && Math.abs(lon) <= 180;
    document.querySelectorAll('[data-keep-query]').forEach(function (a) { a.href = a.getAttribute('href') + location.search; });
    if (!valid) {
      document.getElementById('ok').hidden = true;
      document.getElementById('bad').hidden = false;
      return;
    }
    var name = (q.get('n') || '').trim().slice(0, 80) || cfg.fallback;
    document.getElementById('name').textContent = name;
    document.title = name + ' — ' + document.title.split(' — ').pop();
    var la = lat.toFixed(5), lo = lon.toFixed(5);
    document.getElementById('coords').textContent = la + ', ' + lo;

    var ua = navigator.userAgent;
    var android = /Android/i.test(ua);
    var ios = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
    var open = document.getElementById('open');
    if (android) {
      // intent: opens the app if installed, otherwise Play. A plain link to this
      // same URL would stay in the browser.
      open.href = 'intent://masarmaps.com/p' + location.search + '#Intent;scheme=https;package=' + cfg.pkg +
        ';S.browser_fallback_url=' + encodeURIComponent(cfg.play) + ';end';
    } else {
      open.href = 'https://masarmaps.com/p' + location.search;
    }
    var get = document.getElementById('get');
    if (ios) {
      if (cfg.appStore) get.href = cfg.appStore; else { get.hidden = true; document.getElementById('soon').hidden = false; }
    }
    var map = document.getElementById('map');
    map.href = android
      ? 'geo:' + la + ',' + lo + '?q=' + la + ',' + lo + '(' + encodeURIComponent(name) + ')'
      : 'https://www.openstreetmap.org/?mlat=' + la + '&mlon=' + lo + '#map=17/' + la + '/' + lo;
  })();
  </script>
  <script>
  (function () {
    var b = document.getElementById('theme-btn');
    if (!b) return;
    var order = ['auto', 'light', 'dark'];
    var root = document.documentElement;
    function current() { return root.getAttribute('data-theme') || 'auto'; }
    function show() { var m = current(); b.querySelector('span').textContent = b.dataset[m]; b.setAttribute('aria-label', b.dataset.title + ': ' + b.dataset[m]); }
    b.addEventListener('click', function () {
      var next = order[(order.indexOf(current()) + 1) % 3];
      if (next === 'auto') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', next);
      try { if (next === 'auto') localStorage.removeItem('masar-theme'); else localStorage.setItem('masar-theme', next); } catch (e) {}
      show();
    });
    show();
  })();
  </script>
</body>
</html>
