<!doctype html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#31C6F7">
  <meta name="color-scheme" content="light">
  <meta name="robots" content="noindex">
  <title>شوێن لەسەر مسار — مسار</title>
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Masar Maps">
  <meta property="og:title" content="شوێن لەسەر مسار">
  <meta property="og:image" content="https://masarmaps.com/assets/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/svg+xml" href="/assets/masar-logo.svg">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="stylesheet" href="/assets/pages.css">
</head>
<body>
  <header>
    <div class="wrap">
      <a class="brand" href="/" aria-label="سەرەتا"><img src="/assets/masar-logo.svg" alt="" width="40" height="40"><span>مسار</span></a>
      <nav class="langs" aria-label="Language"><a href="/p" lang="ar" hreflang="ar" data-keep-query>العربية</a><a href="/en/p" lang="en" hreflang="en" data-keep-query>English</a><a href="/ckb/p" lang="ckb" hreflang="ckb" data-keep-query aria-current="page">کوردی</a></nav>
    </div>
  </header>
  <main class="wrap">
    <article class="card place">
      <img class="place-pin" src="/assets/masar-logo.svg" alt="" width="64" height="64">
      <h1 id="name">شوێنی هاوبەشکراو</h1>
      <p class="lead coords"><bdi id="coords"></bdi></p>
      <div id="ok">
        <div class="btn-row">
          <a class="mail" id="open" href="#">لە مسار بیکەرەوە</a>
          <a class="btn-secondary" id="get" href="https://play.google.com/store/apps/details?id=com.masarmaps">ئەپەکە دابگرە</a>
        </div>
        <p><a id="map" href="#">لە نەخشەیەکدا بیکەرەوە</a></p>
        <p class="sources" id="soon" hidden>بەم زووانە لە App Store و Google Play.</p>
      </div>
      <p class="lead" id="bad" hidden>ئەم بەستەرە دروست نییە.</p>
    </article>
  </main>
  <footer class="wrap">
    <p>داتای نەخشە © <a href="https://www.openstreetmap.org/copyright">بەشداربووانی OpenStreetMap</a> · <bdi>masarmaps.com</bdi></p>
  </footer>
  <script>
  (function () {
    var cfg = {"play": "https://play.google.com/store/apps/details?id=com.masarmaps", "appStore": "", "pkg": "com.masarmaps", "fallback": "شوێنی هاوبەشکراو"};
    var q = new URLSearchParams(location.search);
    var ll = (q.get('ll') || '').split(',');
    var lat = parseFloat(ll[0]), lon = parseFloat(ll[1]);
    var valid = ll.length === 2 && isFinite(lat) && isFinite(lon) && Math.abs(lat) <= 90 && Math.abs(lon) <= 180;
    document.querySelectorAll('[data-keep-query]').forEach(function (a) { a.href = a.getAttribute('href') + location.search; });
    if (!valid) {
      document.getElementById('ok').hidden = true;
      document.getElementById('bad').hidden = false;
      return;
    }
    var name = (q.get('n') || '').trim().slice(0, 80) || cfg.fallback;
    document.getElementById('name').textContent = name;
    document.title = name + ' — ' + document.title.split(' — ').pop();
    var la = lat.toFixed(5), lo = lon.toFixed(5);
    document.getElementById('coords').textContent = la + ', ' + lo;

    var ua = navigator.userAgent;
    var android = /Android/i.test(ua);
    var ios = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
    var canonical = 'https://masarmaps.com/p' + location.search;
    var open = document.getElementById('open');
    if (android) {
      // intent: opens the app if installed, otherwise Play. A plain link to this
      // same URL would stay in the browser.
      open.href = 'intent://masarmaps.com/p' + location.search + '#Intent;scheme=https;package=' + cfg.pkg +
        ';S.browser_fallback_url=' + encodeURIComponent(cfg.play) + ';end';
    } else {
      open.href = canonical;
    }
    var get = document.getElementById('get');
    if (ios) {
      if (cfg.appStore) get.href = cfg.appStore; else { get.hidden = true; document.getElementById('soon').hidden = false; }
    }
    var map = document.getElementById('map');
    map.href = android
      ? 'geo:' + la + ',' + lo + '?q=' + la + ',' + lo + '(' + encodeURIComponent(name) + ')'
      : 'https://www.openstreetmap.org/?mlat=' + la + '&mlon=' + lo + '#map=17/' + la + '/' + lo;
  })();
  </script>
</body>
</html>
