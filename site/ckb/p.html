<!doctype html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F4F5F6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#17181B" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <script>try{var t=localStorage.getItem('masar-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
  <link rel="icon" type="image/svg+xml" href="/assets/masar-logo.svg">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="preload" href="/assets/fonts/Vazirmatn-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/pages.css">
  <meta name="robots" content="noindex">
  <title>شوێن لەسەر مسار — مسار</title>
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Masar Maps">
  <meta property="og:title" content="شوێن لەسەر مسار">
  <meta property="og:image" content="https://masarmaps.com/assets/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <a class="brand" href="/" aria-label="سەرەتا"><img class="tile" src="/assets/brand/masar-app-tile-light.svg" alt="" width="40" height="40"><img class="word on-light" src="/assets/brand/masar-wordmark-arabic-light.svg" alt="مسار" width="68" height="34"><img class="word on-dark" src="/assets/brand/masar-wordmark-arabic-dark.svg" alt="مسار" width="68" height="34"></a>
      <div class="tools"><button class="chip theme-btn" id="theme-btn" type="button" title="ڕووکار" data-title="ڕووکار" data-auto="خۆکار" data-light="ڕووناک" data-dark="تاریک"><svg class="ico" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <path class="duo" d="M12 3A9 9 0 0 1 12 21" fill="#31C6F7"/>
  <path class="line" d="M3 12A9 9 0 1 0 21 12A9 9 0 1 0 3 12ZM12 3L12 21" stroke="#243039" stroke-width="2.4"/>
</svg><span>خۆکار</span></button><nav class="langs" aria-label="Language"><a class="chip" href="/p" lang="ar" hreflang="ar" data-keep-query>العربية</a><a class="chip" href="/en/p" lang="en" hreflang="en" data-keep-query>English</a><a class="chip" href="/ckb/p" lang="ckb" hreflang="ckb" data-keep-query aria-current="page">کوردی</a></nav></div>
    </div>
  </header>
  <main class="wrap">
    <section class="card place">
      <div class="host-static"><img src="/assets/brand/mascot.svg" alt="" width="78" height="76"></div>
      <h1 id="name">شوێنی هاوبەشکراو</h1>
      <p class="lead coords"><bdi id="coords"></bdi></p>
      <div id="ok">
        <div class="btn-row">
          <a class="btn" id="open" href="#">لە مسار بیکەرەوە</a>
          <a class="btn-secondary" id="get" href="https://play.google.com/store/apps/details?id=com.masarmaps">ئەپەکە دابگرە</a>
        </div>
        <p><a id="map" href="#">لە نەخشەیەکدا بیکەرەوە</a></p>
        <p class="sources" id="soon" hidden>بەم زووانە لە App Store و Google Play.</p>
      </div>
      <p class="lead" id="bad" hidden>ئەم بەستەرە دروست نییە.</p>
    </section>
  </main>
  <footer class="foot wrap">
    <p>داتای نەخشە © <a href="https://www.openstreetmap.org/copyright">بەشداربووانی OpenStreetMap</a> · <bdi>masarmaps.com</bdi></p>
  </footer>
  <script>
  (function () {
    var cfg = {"play": "https://play.google.com/store/apps/details?id=com.masarmaps", "appStore": "", "pkg": "com.masarmaps", "fallback": "شوێنی هاوبەشکراو"};
    var q = new URLSearchParams(location.search);
    var ll = (q.get('ll') || '').split(',');
    var lat = parseFloat(ll[0]), lon = parseFloat(ll[1]);
    var valid = ll.length === 2 && isFinite(lat) && isFinite(lon) && Math.abs(lat) <= 90 && Math.abs(lon) <= 180;
    document.querySelectorAll('[data-keep-query]').forEach(function (a) { a.href = a.getAttribute('href') + location.search; });
    if (!valid) {
      document.getElementById('ok').hidden = true;
      document.getElementById('bad').hidden = false;
      return;
    }
    var name = (q.get('n') || '').trim().slice(0, 80) || cfg.fallback;
    document.getElementById('name').textContent = name;
    document.title = name + ' — ' + document.title.split(' — ').pop();
    var la = lat.toFixed(5), lo = lon.toFixed(5);
    document.getElementById('coords').textContent = la + ', ' + lo;

    var ua = navigator.userAgent;
    var android = /Android/i.test(ua);
    var ios = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
    var open = document.getElementById('open');
    if (android) {
      // intent: opens the app if installed, otherwise Play. A plain link to this
      // same URL would stay in the browser.
      open.href = 'intent://masarmaps.com/p' + location.search + '#Intent;scheme=https;package=' + cfg.pkg +
        ';S.browser_fallback_url=' + encodeURIComponent(cfg.play) + ';end';
    } else {
      open.href = 'https://masarmaps.com/p' + location.search;
    }
    var get = document.getElementById('get');
    if (ios) {
      if (cfg.appStore) get.href = cfg.appStore; else { get.hidden = true; document.getElementById('soon').hidden = false; }
    }
    var map = document.getElementById('map');
    map.href = android
      ? 'geo:' + la + ',' + lo + '?q=' + la + ',' + lo + '(' + encodeURIComponent(name) + ')'
      : 'https://www.openstreetmap.org/?mlat=' + la + '&mlon=' + lo + '#map=17/' + la + '/' + lo;
  })();
  </script>
  <script>
  (function () {
    var b = document.getElementById('theme-btn');
    if (!b) return;
    var order = ['auto', 'light', 'dark'];
    var root = document.documentElement;
    function current() { return root.getAttribute('data-theme') || 'auto'; }
    function show() { var m = current(); b.querySelector('span').textContent = b.dataset[m]; b.setAttribute('aria-label', b.dataset.title + ': ' + b.dataset[m]); }
    b.addEventListener('click', function () {
      var next = order[(order.indexOf(current()) + 1) % 3];
      if (next === 'auto') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', next);
      try { if (next === 'auto') localStorage.removeItem('masar-theme'); else localStorage.setItem('masar-theme', next); } catch (e) {}
      show();
    });
    show();
  })();
  </script>
</body>
</html>
