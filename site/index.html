    :root {
      color-scheme: light;
      --cyan: #31C6F7;
      --ink: #243039;
      --muted: #50616F;
      --paper: #F7FCFE;
      --mark-size: clamp(144px, 23vw, 190px);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { min-width: 280px; background: var(--paper); }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      grid-template-rows: 1fr auto;
      color: var(--ink);
      background: var(--paper);
      font-family: 'Masar English', Arial, sans-serif;
      font-weight: 600;
      font-synthesis: none;
      -webkit-font-smoothing: antialiased;
      isolation: isolate;
    }
    ::selection { background: #B5EBFD; color: var(--ink); }

    /* Decorative map. The original Masar logo stays intact below. */
    .map {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: -1;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 50% 41%, #FFFFFF 0%, #FFFFFFCC 24%, #FFFFFF00 66%),
        linear-gradient(145deg, #EAF9FF 0%, #F7FCFE 56%, #EAF9FF 100%);
    }
    .map svg { width: 100%; height: 100%; opacity: .58; }
    .streets { fill: none; stroke: #DCEFF6; stroke-width: 2; }
    .route-base { fill: none; stroke: #D2EDF7; stroke-width: 6; stroke-linecap: round; }
    .route-flow {
      fill: none;
      stroke: var(--cyan);
      stroke-width: 3;
      stroke-linecap: round;
      stroke-dasharray: 7 21;
      opacity: .38;
      animation: route-flow 16s linear infinite;
    }
    .route-flow.reverse { animation-direction: reverse; animation-duration: 20s; }

    main {
      width: 100%;
      display: grid;
      place-items: center;
      padding-block: clamp(32px, 7vh, 72px);
      padding-inline: max(24px, env(safe-area-inset-left)) max(24px, env(safe-area-inset-right));
    }
    .content { width: min(100%, 680px); text-align: center; }
    .logo-stage {
      position: relative;
      display: grid;
      place-items: center;
      width: var(--mark-size);
      height: var(--mark-size);
      margin: 0 auto 34px;
      animation: arrive .85s ease-out both;
    }
    .logo-stage::before {
      content: '';
      position: absolute;
      inset: -30px;
      border: 1px solid #31C6F725;
      border-radius: 50%;
      animation: halo 5.5s ease-in-out infinite;
    }
    .logo-stage::after {
      content: '';
      position: absolute;
      bottom: -23px;
      width: 65%;
      height: 12px;
      background: #169AC019;
      border-radius: 50%;
      filter: blur(7px);
      animation: shadow 6s ease-in-out infinite;
      z-index: -1;
    }
    .logo-float {
      width: 100%;
      height: 100%;
      animation: float 6s ease-in-out infinite;
      filter: drop-shadow(0 14px 20px #007EAB12);
    }
    .masar-logo { display: block; width: 100%; height: 100%; }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      margin: 0 0 26px;
      animation: arrive .85s .1s ease-out both;
    }
    .brand-en { font-size: clamp(24px, 4vw, 31px); letter-spacing: -.025em; }
    .brand-ar {
      font-family: 'Masar Arabic', Tahoma, sans-serif;
      font-weight: 700;
      font-size: clamp(27px, 4.5vw, 35px);
      line-height: 1.35;
    }
    .brand-divider { width: 1px; height: 21px; background: #C6DDE6; }
    h1 {
      margin: 0;
      font-size: clamp(42px, 7.4vw, 78px);
      font-weight: 600;
      line-height: 1.12;
      letter-spacing: -.045em;
      animation: arrive .85s .18s ease-out both;
    }
    @supports ((background-clip: text) or (-webkit-background-clip: text)) {
      h1 {
        color: transparent;
        background-image: linear-gradient(110deg, #243039 35%, #007EAB 49%, #243039 63%);
        background-size: 250% 100%;
        background-clip: text;
        -webkit-background-clip: text;
        animation: arrive .85s .18s ease-out both, shimmer 9s 1s ease-in-out infinite;
      }
    }
    .arabic {
      margin: 14px 0 0;
      color: var(--muted);
      font-family: 'Masar Arabic', Tahoma, sans-serif;
      font-weight: 700;
      font-size: clamp(28px, 4.2vw, 36px);
      line-height: 1.55;
      animation: arrive .85s .26s ease-out both;
    }
    .waiting {
      display: flex;
      justify-content: center;
      gap: 7px;
      margin: 23px auto 0;
      height: 6px;
      animation: arrive .85s .34s ease-out both;
    }
    .waiting span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--cyan);
      animation: dots 2.4s ease-in-out infinite;
    }
    .waiting span:nth-child(2) { animation-delay: .2s; }
    .waiting span:nth-child(3) { animation-delay: .4s; }
    footer {
      text-align: center;
      padding: 0 24px max(26px, env(safe-area-inset-bottom));
      font-size: 14px;
      letter-spacing: .035em;
      color: var(--muted);
      animation: arrive .85s .42s ease-out both;
    }

    .legal { display: flex; justify-content: center; align-items: center; gap: 2px; margin-top: 2px; font-size: 12px; letter-spacing: .02em; }
    .legal a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 6px; color: var(--muted); text-decoration: none; }
    .legal a[lang="ar"] { font-family: 'Masar Arabic', Tahoma, sans-serif; font-size: 14px; font-weight: 700; letter-spacing: 0; }
    .legal a:hover, .legal a:focus-visible { color: var(--ink); text-decoration: underline; text-decoration-color: var(--cyan); text-underline-offset: 3px; }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(-1.5deg); }
      50% { transform: translateY(-10px) rotate(1.5deg); }
    }
    @keyframes shadow {
      0%, 100% { transform: scaleX(1); opacity: .85; }
      50% { transform: scaleX(.78); opacity: .45; }
    }
    @keyframes halo {
      0%, 100% { transform: scale(1); opacity: .65; }
      50% { transform: scale(1.07); opacity: 1; }
    }
    @keyframes route-flow { to { stroke-dashoffset: -448; } }
    @keyframes shimmer {
      0%, 20%, 100% { background-position: 100% 50%; }
      60%, 80% { background-position: 0% 50%; }
    }
    @keyframes dots {
      0%, 70%, 100% { opacity: .3; transform: translateY(0); }
      35% { opacity: 1; transform: translateY(-3px); }
    }
    @media (max-width: 420px) {
      .brand { gap: 12px; margin-bottom: 21px; }
      .logo-stage { margin-bottom: 28px; }
      .map svg { opacity: .4; }
    }
    @media (max-height: 560px) {
      :root { --mark-size: 108px; }
      main { padding-block: 26px; }
      .logo-stage { margin-bottom: 19px; }
      .logo-stage::before { inset: -18px; }
      .brand { margin-bottom: 12px; }
      .brand-en { font-size: 23px; }
      .brand-ar { font-size: 26px; }
      h1 { font-size: 42px; }
      .arabic { margin-top: 5px; font-size: 26px; }
      .waiting { margin-top: 12px; }
      footer { padding-bottom: max(18px, env(safe-area-inset-bottom)); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
