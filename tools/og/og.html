<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<style>
@font-face { font-family: 'Baloo Bhaijaan 2'; src: url('../../site/assets/fonts/BalooBhaijaan2-Bold.woff2'); font-weight: 700; }
@font-face { font-family: 'Readex Pro'; src: url('../../site/assets/fonts/ReadexPro-SemiBold.woff2'); font-weight: 600; }
@font-face { font-family: 'Fredoka'; src: url('../../site/assets/fonts/Fredoka-SemiBold.woff2'); font-weight: 600; }
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
body { background: linear-gradient(145deg, #EAF9FF 0%, #F7FCFE 55%, #EAF9FF 100%); color: #243039;
  display: flex; align-items: center; gap: 64px; padding: 0 90px; box-sizing: border-box; font-family: 'Readex Pro'; }
img { width: 300px; height: 300px; flex: none; filter: drop-shadow(0 16px 24px #007EAB22); }
h1 { font-family: 'Baloo Bhaijaan 2'; font-weight: 700; font-size: 96px; line-height: 1.1; margin: 0; }
.k { font-family: 'Baloo Bhaijaan 2'; font-weight: 700; font-size: 58px; line-height: 1.25; margin: 6px 0 0; }
.en { font-family: 'Fredoka'; font-size: 34px; margin: 18px 0 0; color: #50616F; direction: ltr; text-align: right; }
.pill { display: inline-block; margin-top: 26px; padding: 10px 26px; border: 3px solid #000; border-radius: 16px; background: #31C6F7; font-size: 30px; font-weight: 600; }
</style></head>
<body>
<img src="../../site/assets/masar-logo.svg" alt="">
<div>
  <h1>مسار</h1>
  <p class="k">بديل ويز في العراق</p>
  <p class="en">Masar — the Iraqi navigation app</p>
