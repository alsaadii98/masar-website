name: Publish Masar Maps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy coming-soon page
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out website
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # upload-pages-artifact drops dot-directories, so .well-known (app links)
      # would be lost. Package the site ourselves, the way that action does.
      - name: Package website
        run: |
          tar --dereference --hard-dereference --directory site \
            -cvf "$RUNNER_TEMP/artifact.tar" --exclude=.git --exclude=.github .
          tar -tf "$RUNNER_TEMP/artifact.tar" | grep -q '^./.well-known/assetlinks.json$'

      - name: Upload website
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
